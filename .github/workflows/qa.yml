name: Beauty Engine QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JS syntax
        run: |
          node --check main.v0.2.4.js
          node --check mesh-warp.v0.2.4.mjs
          node --check reference-match.v0.2.4.mjs
          node --check reference-panel.v0.2.4.mjs
          node --check live-safety.v0.2.4.mjs
      - name: Dynamic mesh and live safety tests
        run: node --test tests/*.test.mjs
      - name: Static legacy feature regressions
        run: |
          for file in tests_*.py; do python "$file"; done
