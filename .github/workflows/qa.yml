name: Beauty Engine QA
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-and-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JS syntax
        run: |
          node --check main.v0.9.0.js
          node --check mesh-warp.v0.9.0.mjs
          node --check reference-match.v0.9.0.mjs
          node --check reference-panel.v0.9.0.mjs
          node --check live-safety.v0.9.0.mjs
          node --check live-performance.v0.9.0.mjs
          node --check ambient-light.v0.9.0.mjs
          node --check look-presets.v0.9.0.mjs
          node --check face-pose.v0.9.0.mjs
          node --check occlusion-guard.v0.9.0.mjs
          node --check live-transition.v0.9.0.mjs
          node --check semantic-occlusion.v0.9.0.mjs
          node --check semantic-occlusion-runtime.v0.9.0.mjs
          node --check semantic-temporal.v0.9.0.mjs
          node --check face-light-field.v0.9.0.mjs
          node --check pose-continuity.v0.9.0.mjs
          node --check matte-alignment.v0.9.0.mjs
          node --check face-sculpt.v0.9.0.mjs
          node --check look-links.v0.9.0.mjs
      - name: Dynamic mesh and live safety tests
        run: node --test tests/*.test.mjs
      - name: Static legacy feature regressions
        run: |
          for file in tests_*.py; do python "$file"; done
